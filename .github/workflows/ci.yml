name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hacer ejecutable los scripts
        run: chmod +x ./scripts/test.sh
      - name: Ejecutar tests simulados
        run: ./scripts/test.sh
